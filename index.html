    const { useState, useMemo, useCallback, useEffect, useRef } = React;
    const NUM = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

    // Sports where the primary side market is moneyline, not spread

    function sprLabel(sport) { return isMLSport(sport) ? "ML" : "Spr"; }
    function spreadLabel(sport) { return isMLSport(sport) ? "Moneyline" : "Spread"; }

    // Live data fetching from GitHub
    const GITHUB_RAW = "https://raw.githubusercontent.com/yxxvccy/multi-scraper/main/data";
    const SCRAPE_SPORTS = ["cbb", "wcbb", "nba", "wnba", "nfl", "nhl", "mlb", "epl", "ucl", "cfb", "cbase"];
    const REFRESH_INTERVAL_MS = 5 * 60 * 1000;
    function getDatesToFetch() {
      const dates = [], now = new Date();
      for (let offset = -1; offset <= 1; offset++) { const d = new Date(now); d.setDate(d.getDate() + offset); dates.push(fmtDate(d)); }
      return dates;
    }
    async function fetchCSV(url) {
      try {
        const resp = await fetch(url + `?t=${Date.now()}`);
        if (!resp.ok) return [];
        const text = await resp.text();
        return new Promise(resolve => { window.Papa.parse(text, { header: true, skipEmptyLines: true, complete: r => resolve(r.data || []), error: () => resolve([]) }); });
      } catch(e) { return []; }
    }
    async function fetchLiveData() {
      const dates = getDatesToFetch(), jobs = [];
      for (const sport of SCRAPE_SPORTS) for (const date of dates) jobs.push(`${GITHUB_RAW}/timeseries/${sport}_${date}.csv`);
      return (await Promise.all(jobs.map(fetchCSV))).flat();
    }

    function normName(s) { return (s||"").toLowerCase().replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim(); }
    const ABBREVS={"s ":"south ","n ":"north ","e ":"east ","w ":"west ","c ":"central ","st ":"state ","st. ":"state ","mt ":"mount ","ft ":"fort ","u ":"university ","uc ":"uc ","so ":"southern ","no ":"northern ","fla ":"florida ","ga ":"georgia ","la ":"louisiana ","miss ":"mississippi ","ark ":"arkansas ","ala ":"alabama ","tenn ":"tennessee ","mich ":"michigan ","minn ":"minnesota ","conn ":"connecticut ","mass ":"massachusetts ","penn ":"penn ","col ":"colorado ","ore ":"oregon ","wash ":"washington ","okla ":"oklahoma ","neb ":"nebraska ","wis ":"wisconsin ","ill ":"illinois "};
    function expandAbbrevs(s){let r=" "+s+" ";Object.entries(ABBREVS).forEach(([k,v])=>{r=r.replace(new RegExp(" "+k,"gi")," "+v);});return r.trim();}
    function fuzzy(a, b) {

      if (xn.length>=4&&(xn.includes(yn)||yn.includes(xn))) return true;
      if (x.length>=4&&(x.includes(y)||y.includes(x))) return true;
      const xe=expandAbbrevs(x), ye=expandAbbrevs(y);

      if (xe.length>=4&&(xe.includes(ye)||ye.includes(xe))) return true;

    }

    async function fetchESPN(sport, dateStr) {
      const resolved = SPORT_ALIASES[sport] || sport;

        dateStr ? `${base}?dates=${dateStr}&limit=200` : `${base}?limit=200`,

              startEpoch, sId: String(st?.id||""), sTxt: st?.shortDetail||st?.description||"", done: st?.completed||false,

    }

    }

    /* -- UI Components -- */
    function LinePill({v,l,moved,prev}){return(<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:C.card,borderRadius:6,border:`1px solid ${moved?C.amb:C.bdr}`}}><span style={{fontSize:9,color:C.txM,textTransform:"uppercase",letterSpacing:1.5}}>{l}</span><span style={{fontSize:18,fontWeight:700,fontFamily:MN,color:moved?C.amb:C.tx}}>{v||"\u2014"}</span>{moved&&prev!=null&&<span style={{fontSize:10,color:C.txM,fontFamily:MN}}>({prev>v?"\u25BC":"\u25B2"}{Math.abs(prev-v).toFixed(1)})</span>}</div>);}

    function ScoreBlock({e,spr,tot,aw,hm,game}){

    function MoveChart({history,metric,containerWidth}){const data=history.map(r=>{const t=r.timestamp?.split("T")[1]?.slice(0,5)||`#${r.scrape_num}`;return{time:t,awH:NUM(r[`${metric}_away_handle_pct`])||NUM(r[`${metric}_over_handle_pct`]),awB:NUM(r[`${metric}_away_bets_pct`])};});return(<div><div style={{marginBottom:8}}><span style={{fontSize:11,fontWeight:700,color:C.txD,textTransform:"uppercase",letterSpacing:1.5}}>{metric==="ml"?"Moneyline":metric==="total"?"Total (Over/Under)":"Spread"} Movement</span></div><SVGAreaChart data={data} width={containerWidth} height={280} dataKeyX="time" yDomain={[0,100]} refLineY={50} lines={[{key:"awH",color:C.hdl},{key:"awB",color:C.bet}]}/></div>);}

    function SourceCompare({gameId,allData,sport}){

    /* ========== NEW: Summary Dashboard ========== */
    function SummaryTab({data,games,getESPN,latestByGameSrc}){
      const [sMin,setSMin]=useState(10),[tMin,setTMin]=useState(10);
      const [sumSport,setSumSport]=useState("all");
      const btn=sel=>({padding:"4px 10px",fontSize:10,fontWeight:600,background:sel?C.cyn:"transparent",color:sel?C.bg:C.txM,border:`1px solid ${sel?C.cyn:C.bdr}`,borderRadius:4,cursor:"pointer"});
      const availSports=useMemo(()=>{
        const s=new Set();Object.values(latestByGameSrc).forEach(g=>{if(g.source==="vsin_dk")s.add(g.sport);});
        return [...s].sort();
      },[latestByGameSrc]);
      const results=useMemo(()=>{
        const out={sprHit:0,sprMiss:0,totHit:0,totMiss:0,sprGames:[],totGames:[]};
        Object.values(latestByGameSrc).forEach(g=>{
          if(g.source!=="vsin_dk")return;
          if(sumSport!=="all"&&g.sport!==sumSport)return;
          const espn=getESPN(g);if(!espn||!(espn.done||espn.sId==="3"))return;
          const sd=NUM(g.spread_bets_handle_divergence),td=NUM(g.total_bets_handle_divergence);
          const pred=evalPrediction(g,espn),lean=sharpLean(g);
          if(sd>=sMin&&pred.spread){
            if(pred.spread==="hit")out.sprHit++;else out.sprMiss++;
            out.sprGames.push({g,espn,pred,lean,sd});
          }
          if(td>=tMin&&pred.total){
            if(pred.total==="hit")out.totHit++;else out.totMiss++;
            out.totGames.push({g,espn,pred,lean,td});
          }
        });
        return out;
      },[latestByGameSrc,getESPN,sMin,tMin,sumSport]);
      const sprT=results.sprHit+results.sprMiss,totT=results.totHit+results.totMiss;
      const sprP=sprT?((results.sprHit/sprT)*100).toFixed(1):"--",totP=totT?((results.totHit/totT)*100).toFixed(1):"--";
      const allH=results.sprHit+results.totHit,allT=sprT+totT,allP=allT?((allH/allT)*100).toFixed(1):"--";

      function ResultRow({item,type}){
        const isHit=type==="spread"?item.pred.spread==="hit":item.pred.total==="hit";

          ?(isHit?`${lbl} covered`:`${lbl} did not cover`)

          <div style={{display:"flex",alignItems:"stretch",marginBottom:4,borderRadius:6,overflow:"hidden",border:`1px solid ${accentClr}33`}}>

                  <span style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8,color:type==="spread"?C.cyn:C.pur}}>{type==="spread"?("Sharp "+sprLabel(item.g.sport)):"Sharp O/U"}</span>

                <div style={{fontSize:10,fontWeight:700,fontFamily:MN,color:accentClr,marginTop:2}}>{divVal.toFixed(0)}<span style={{fontSize:8}}> div%</span></div>
              </div>
            </div>
          </div>
        );

      return(<div style={{padding:24,overflowY:"auto",height:"100%"}}>

            <div style={{fontSize:32,fontWeight:700,fontFamily:MN,color:C.tx}}>{allH}-{allT-allH}</div>
            <div style={{fontSize:11,color:C.txM,marginTop:4}}>{allP}% hit · {allT} games</div>
            <div style={{marginTop:8,height:6,background:C.bdr,borderRadius:3,overflow:"hidden"}}>{allT>0&&<div style={{width:`${(allH/allT)*100}%`,height:"100%",background:`linear-gradient(90deg,${C.amb},${C.ambD})`,borderRadius:3}}/>}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.cyn,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Spread Results ({results.sprGames.length})</div>
            {results.sprGames.length===0?<div style={{padding:20,textAlign:"center",color:C.txM,fontSize:11}}>No completed spread signals at {sMin}%+ div</div>:results.sprGames.map((it,i)=><ResultRow key={i} item={it} type="spread"/>)}
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.pur,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Total Results ({results.totGames.length})</div>
            {results.totGames.length===0?<div style={{padding:20,textAlign:"center",color:C.txM,fontSize:11}}>No completed total signals at {tMin}%+ div</div>:results.totGames.map((it,i)=><ResultRow key={i} item={it} type="total"/>)}
          </div>
        </div>
      </div>);
    }

    /* ========== Main Dashboard ========== */
    function Dashboard(){
      const [data,setData]=useState([]);
      const [loading,setLoading]=useState(true);
      const [fetchError,setFetchError]=useState(null);
      const [lastFetch,setLastFetch]=useState(null);
      const [manualUpload,setManualUpload]=useState(false);
      const [sportFilter,setSportFilter]=useState("all");
      const [sourceFilter,setSourceFilter]=useState("vsin_dk");
      const [dateFilter,setDateFilter]=useState("all");
      const [sortBy,setSortBy]=useState("max_div");
      const [minSpreadDiv,setMinSpreadDiv]=useState(20);
      const [minTotalDiv,setMinTotalDiv]=useState(20);
      const [selectedId,setSelectedId]=useState(null);
      const [metric,setMetric]=useState("spread");
      const [espnCache,setEspnCache]=useState({});
      const [tab,setTab]=useState("games");

      // Live data fetch on mount + auto-refresh
      const firstLoad = useRef(true);
      useEffect(()=>{
        if(manualUpload) return;
        let cancelled = false;
        async function doFetch(){
          try {
            if(firstLoad.current) setLoading(true);
            const rows = await fetchLiveData();
            if(cancelled) return;
            if(rows.length > 0){ setData(rows); setFetchError(null); }
            else { setFetchError("No data found for recent dates. The scraper may not have run yet."); }
            setLastFetch(new Date());
          } catch(err) { if(!cancelled) setFetchError("Failed to fetch data: " + err.message); }
          finally { if(!cancelled){ setLoading(false); firstLoad.current = false; } }
        }
        doFetch();
        const interval = setInterval(doFetch, REFRESH_INTERVAL_MS);
        return () => { cancelled = true; clearInterval(interval); };
      },[manualUpload]);

      // Filter hidden sources for display
      const filteredData=useMemo(()=>data.filter(r=>!HIDDEN_SOURCES.has(r.source)),[data]);

      const selectGame=useCallback(id=>setSelectedId(id),[]);
      const detailRef=useRef(null);
      const detailWidth=useContainerWidth(detailRef);

      useEffect(()=>{
        const dates=new Set(filteredData.map(r=>getGameDate(r)));
        const sports=new Set(filteredData.map(r=>SPORT_ALIASES[r.sport]||r.sport));
        const jobs=[];
        dates.forEach(dt=>{sports.forEach(sp=>{const k=`${sp}_${dt}`;if(!espnCache[k])jobs.push({sport:sp,date:dt,key:k});});});
        if(jobs.length===0)return;
        Promise.all(jobs.map(async({sport,date,key})=>{const g=await fetchESPN(sport,date);return{key,games:g};})).then(res=>{const upd={...espnCache};res.forEach(({key,games})=>upd[key]=games);setEspnCache(upd);});
      },[filteredData]);

      const getESPN=useCallback(game=>{const dt=getGameDate(game),resolved=SPORT_ALIASES[game.sport]||game.sport,k=`${resolved}_${dt}`,eg=espnCache[k];return eg?matchESPN(game,eg):null;},[espnCache]);
      // Picks the most/least recent reading per (game_id, source) using
      // timestamp (an ISO 8601 string that sorts lexicographically). We
      // can't rely on `scrape_num` here because the scraper resets that
      // counter to 1 at the start of every GitHub Actions run, so it's
      // only valid within a single scrape, not across the day's data.
      const latestByGameSrc=useMemo(()=>{const m={};filteredData.forEach(r=>{const k=`${r.game_id}__${r.source}`;if(!m[k]||(r.timestamp||"")>(m[k].timestamp||""))m[k]=r;});return m;},[filteredData]);
      const firstByGame=useMemo(()=>{const m={};filteredData.forEach(r=>{const k=`${r.game_id}__${r.source}`;if(!m[k]||(r.timestamp||"")<(m[k].timestamp||""))m[k]=r;});return m;},[filteredData]);
      const games=useMemo(()=>Object.values(latestByGameSrc),[latestByGameSrc]);
      const todayStr=useMemo(()=>fmtDate(new Date()),[]);
      const tmrwStr=useMemo(()=>{const t=new Date();t.setDate(t.getDate()+1);return fmtDate(t);},[]);
      const availDates=useMemo(()=>[...new Set(games.map(g=>getGameDate(g)))].sort(),[games]);

      // Cross-sport contamination filter (client-side defense).
      //
      // The scraper occasionally writes rows from one sport's page into another
      // sport's CSV (when VSiN's tab switch silently fails and the page falls
      // back to whatever sport is the current default). This guard catches
      // those stale rows by cross-referencing each game's teams against
      // ESPN's schedule for that game's declared sport+date.
      //
      // Decision matrix per row:
      //   - ESPN cache MISSING for the (sport,date) key â†’ KEEP (don't reject
      //     during the brief window before ESPN responds)
      //   - ESPN cache HAS games for that sport+date AND row matches â†’ KEEP
      //   - ESPN cache HAS games for that sport+date AND row does NOT match
      //     AND row's teams DO match some OTHER sport's schedule â†’ DROP
      //     (positive evidence of contamination)
      //   - ESPN cache HAS games but row doesn't match, and no other sport
      //     matches either â†’ KEEP (might be a minor team ESPN missed, or a
      //     preseason game; benefit of the doubt)
      //   - ESPN cache has ZERO games for that sport+date â†’ KEEP (off-season
      //     or schedule not yet posted; can't tell)
      const cleaned=useMemo(()=>{
        if(!games.length)return games;
        const cacheKeys=Object.keys(espnCache);
        if(!cacheKeys.length)return games;  // nothing to check against yet
        let dropped=0;
        const result=games.filter(g=>{
          const dt=getGameDate(g);
          if(!dt)return true;
          const ownSport=SPORT_ALIASES[g.sport]||g.sport;
          const ownKey=`${ownSport}_${dt}`;
          const ownEspn=espnCache[ownKey];
          // No ESPN data loaded yet for this sport+date â†’ keep
          if(!ownEspn)return true;
          const ownGames=Object.values(ownEspn);
          if(!ownGames.length)return true;  // off-season or no games today
          // Does the row match any game on the correct sport's schedule?
          const matchesOwn=ownGames.some(eg=>eg.aN.some(n=>fuzzy(g.away_team,n))&&eg.hN.some(n=>fuzzy(g.home_team,n)));
          if(matchesOwn)return true;
          // Row didn't match its declared sport. Check whether its teams
          // match some OTHER tracked sport's schedule on the same date â€”
          // if so, the row is contaminated and we drop it.
          for(const key of cacheKeys){
            if(key===ownKey)continue;
            if(!key.endsWith(`_${dt}`))continue;
            const otherEspn=espnCache[key];
            if(!otherEspn)continue;
            const otherGames=Object.values(otherEspn);
            if(otherGames.some(eg=>eg.aN.some(n=>fuzzy(g.away_team,n))&&eg.hN.some(n=>fuzzy(g.home_team,n)))){
              dropped++;
              return false;
            }
          }
          // Row doesn't match own schedule but no other-sport evidence either â€”
          // keep it (might be minor school, preseason, etc.).
          return true;
        });
        if(dropped>0)console.log(`[contamination filter] dropped ${dropped} cross-sport row(s)`);
        return result;
      },[games,espnCache]);

      const filtered=useMemo(()=>{
        let f=cleaned;
        if(dateFilter==="today")f=f.filter(g=>getGameDate(g)===todayStr);
        else if(dateFilter==="tomorrow")f=f.filter(g=>getGameDate(g)===tmrwStr);
        if(sportFilter!=="all")f=f.filter(g=>g.sport===sportFilter);
        if(sourceFilter!=="all")f=f.filter(g=>g.source===sourceFilter);
        if(minSpreadDiv>0||minTotalDiv>0){f=f.filter(g=>{const sd=NUM(g.spread_bets_handle_divergence),td=NUM(g.total_bets_handle_divergence);if(minSpreadDiv>0&&minTotalDiv>0)return sd>=minSpreadDiv||td>=minTotalDiv;if(minSpreadDiv>0)return sd>=minSpreadDiv;if(minTotalDiv>0)return td>=minTotalDiv;return true;});}
        return f;
      },[cleaned,dateFilter,todayStr,tmrwStr,sportFilter,sourceFilter,minSpreadDiv,minTotalDiv]);

      const maxDiv=useMemo(()=>{let m=0;filtered.forEach(g=>m=Math.max(m,NUM(g.spread_bets_handle_divergence),NUM(g.total_bets_handle_divergence)));return m;},[filtered]);
      const ranked=useMemo(()=>{
        const arr=[...filtered];
        if(sortBy==="max_div")arr.sort((a,b)=>Math.max(NUM(b.spread_bets_handle_divergence),NUM(b.total_bets_handle_divergence))-Math.max(NUM(a.spread_bets_handle_divergence),NUM(a.total_bets_handle_divergence)));
        else if(sortBy==="spread_div")arr.sort((a,b)=>NUM(b.spread_bets_handle_divergence)-NUM(a.spread_bets_handle_divergence));
        else if(sortBy==="total_div")arr.sort((a,b)=>NUM(b.total_bets_handle_divergence)-NUM(a.total_bets_handle_divergence));
        else if(sortBy==="time")arr.sort((a,b)=>{const ea=getESPN(a),eb=getESPN(b);return(ea?.startEpoch||0)-(eb?.startEpoch||0);});
        else if(sortBy==="time_desc")arr.sort((a,b)=>{const ea=getESPN(a),eb=getESPN(b);return(eb?.startEpoch||0)-(ea?.startEpoch||0);});
        return arr;
      },[filtered,sortBy,getESPN]);

      // Show every configured sport as a filter button, even if no games
      // are currently visible. This means WNBA (and other in-season-but-
      // game-light sports) gets a tab even on days when the dashboard's
      // current filter (date, divergence threshold, etc.) yields no rows.
      // Sports present in `games` but missing from SCRAPE_SPORTS still show
      // so we don't accidentally hide data we don't recognize.
      const sports=useMemo(()=>{
        const fromData=new Set(games.map(g=>g.sport));
        const fromConfig=new Set(SCRAPE_SPORTS);
        return [...new Set([...fromConfig, ...fromData])].sort();
      },[games]);
      const sources=useMemo(()=>[...new Set(games.map(g=>g.source))].sort(),[games]);
      const selectedGame=useMemo(()=>selectedId?latestByGameSrc[selectedId]:null,[selectedId,latestByGameSrc]);

      useEffect(()=>{if(!selectedGame)return;const sd=NUM(selectedGame.spread_bets_handle_divergence),td=NUM(selectedGame.total_bets_handle_divergence);setMetric(td>sd?"total":"spread");},[selectedId]);

      const selectedHistory=useMemo(()=>{if(!selectedId)return[];const[gid,src]=selectedId.split("__");return filteredData.filter(r=>r.game_id===gid&&r.source===src).sort((a,b)=>(a.timestamp||"").localeCompare(b.timestamp||""));},[selectedId,filteredData]);
      const selSrcCount=useMemo(()=>{if(!selectedGame)return 0;return new Set(filteredData.filter(r=>r.game_id===selectedGame.game_id).map(r=>r.source)).size;},[selectedGame,filteredData]);

      const [uploadMode,setUploadMode]=useState("merge");
      const [uploadMsg,setUploadMsg]=useState(null);

      const handleFile=useCallback(e=>{const f=e.target.files?.[0];if(!f)return;e.target.value="";window.Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{if(!r.data||r.data.length===0)return;setManualUpload(true);if(uploadMode==="replace"){setData(r.data);setUploadMsg(`Loaded ${r.data.length} rows`);}else{setData(prev=>{const key=row=>`${row.game_id}||${row.source}||${row.timestamp}`;const existing=new Set(prev.map(key));const newRows=r.data.filter(row=>!existing.has(key(row)));const merged=[...prev,...newRows];setUploadMsg(`Merged +${newRows.length} new rows (${merged.length} total)`);return merged;});}setTimeout(()=>setUploadMsg(null),4000);}});},[uploadMode]);

      const resetToLive=useCallback(()=>{ setManualUpload(false); setData([]); setLoading(true); setSelectedId(null); },[]);

      const btn=sel=>({padding:"4px 10px",fontSize:10,fontWeight:600,background:sel?C.cyn:"transparent",color:sel?C.bg:C.txM,border:`1px solid ${sel?C.cyn:C.bdr}`,borderRadius:4,cursor:"pointer",transition:"all 0.15s"});
      const tabBtn=(sel,clr)=>({padding:"6px 16px",fontSize:11,fontWeight:700,background:sel?(clr||C.cyn):"transparent",color:sel?C.bg:C.txM,border:`1px solid ${sel?(clr||C.cyn):C.bdr}`,borderRadius:6,cursor:"pointer",letterSpacing:0.5});
      const chartW=Math.max(300,detailWidth-48);

      return(
        <div style={{width:"100vw",height:"100vh",background:C.bg,color:C.tx,display:"flex",flexDirection:"column",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"}}>
          <div style={{padding:"14px 20px",borderBottom:`2px solid ${C.bdr}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:16}}>
              <h1 style={{margin:0,fontSize:18,fontWeight:700,letterSpacing:-0.5}}>Sports Betting Dashboard</h1>
              <div style={{display:"flex",gap:4}}>
                <button style={tabBtn(tab==="games")} onClick={()=>setTab("games")}>Games</button>
                <button style={tabBtn(tab==="summary",C.amb)} onClick={()=>setTab("summary")}>Summary</button>
              </div>
              {!manualUpload && lastFetch && <span style={{fontSize:9,color:C.txD,fontFamily:MN}}>Updated {lastFetch.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true})}</span>}
              {!manualUpload && !loading && data.length > 0 && <span style={{width:6,height:6,borderRadius:3,background:C.grn,display:"inline-block",animation:"pulse 2s infinite"}}/>}
              {manualUpload && <span style={{fontSize:9,color:C.amb,fontWeight:600,padding:"2px 8px",background:C.ambB,borderRadius:4,border:`1px solid ${C.ambD}`}}>MANUAL CSV</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {uploadMsg&&<span style={{fontSize:10,color:C.grn,fontWeight:600,padding:"4px 10px",background:C.grnB,borderRadius:4,border:`1px solid ${C.grn}44`}}>{uploadMsg}</span>}
              {manualUpload && <button onClick={resetToLive} style={{padding:"6px 14px",fontSize:11,fontWeight:600,background:C.grn,color:C.bg,borderRadius:6,cursor:"pointer",border:"none"}}>Go Live</button>}
              <div style={{display:"flex",gap:2,background:C.card,borderRadius:5,padding:2,border:`1px solid ${C.bdr}`}}>
                <button style={{...btn(uploadMode==="merge"),fontSize:9,padding:"3px 8px"}} onClick={()=>setUploadMode("merge")} title="Add new rows from CSV, skip duplicates">Merge</button>
                <button style={{...btn(uploadMode==="replace"),fontSize:9,padding:"3px 8px"}} onClick={()=>setUploadMode("replace")} title="Replace all data with CSV">Replace</button>
              </div>
              <label style={{padding:"6px 14px",fontSize:11,fontWeight:600,background:C.cyn,color:C.bg,borderRadius:6,cursor:"pointer"}}>Upload CSV<input type="file" accept=".csv" onChange={handleFile} style={{display:"none"}}/></label>
            </div>
          </div>
          {tab==="summary"?<SummaryTab data={filteredData} games={games} getESPN={getESPN} latestByGameSrc={latestByGameSrc}/>:<>
          <div style={{padding:"7px 20px",borderBottom:`1px solid ${C.bdr}`,display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:9,color:C.txM,textTransform:"uppercase",letterSpacing:1.5}}>Date</span>
            <button style={btn(dateFilter==="all")} onClick={()=>setDateFilter("all")}>All</button>
            {availDates.some(d=>d===todayStr)&&<button style={btn(dateFilter==="today")} onClick={()=>setDateFilter("today")}>Today</button>}
            {availDates.some(d=>d===tmrwStr)&&<button style={btn(dateFilter==="tomorrow")} onClick={()=>setDateFilter("tomorrow")}>Tomorrow</button>}
            <div style={{width:1,height:16,background:C.bdr,margin:"0 3px"}}/>
            <span style={{fontSize:9,color:C.txM,textTransform:"uppercase",letterSpacing:1.5}}>Sport</span>
            <button style={btn(sportFilter==="all")} onClick={()=>setSportFilter("all")}>All</button>
            {sports.map(s=><button key={s} style={btn(sportFilter===s)} onClick={()=>setSportFilter(s)}>{s.toUpperCase()}</button>)}
            <div style={{width:1,height:16,background:C.bdr,margin:"0 3px"}}/>
            <span style={{fontSize:9,color:C.txM,textTransform:"uppercase",letterSpacing:1.5}}>Source</span>
            <button style={btn(sourceFilter==="all")} onClick={()=>setSourceFilter("all")}>All</button>
            {sources.map(s=><button key={s} style={btn(sourceFilter===s)} onClick={()=>setSourceFilter(s)}>{displaySource(s)}</button>)}
            <div style={{width:1,height:16,background:C.bdr,margin:"0 3px"}}/>
            <span style={{fontSize:9,color:C.txM,textTransform:"uppercase",letterSpacing:1.5}}>Sort</span>
            {[["max_div","Max Div"],["spread_div","Spread"],["total_div","Total"],["time","Time \u2191"],["time_desc","Time \u2193"]].map(([k,l])=><button key={k} style={btn(sortBy===k)} onClick={()=>setSortBy(k)}>{l}</button>)}
            <div style={{width:1,height:16,background:C.bdr,margin:"0 3px"}}/>
            <span style={{fontSize:9,color:C.cyn,textTransform:"uppercase",letterSpacing:1.5}}>Spr Min</span>
            {[0,10,15,20,30].map(v=><button key={v} style={btn(minSpreadDiv===v)} onClick={()=>setMinSpreadDiv(v)}>{v}%</button>)}
            <div style={{width:1,height:16,background:C.bdr,margin:"0 3px"}}/>
            <span style={{fontSize:9,color:C.pur,textTransform:"uppercase",letterSpacing:1.5}}>O/U Min</span>
            {[0,10,15,20,30].map(v=><button key={v} style={btn(minTotalDiv===v)} onClick={()=>setMinTotalDiv(v)}>{v}%</button>)}
          </div>
          <div style={{display:"flex",flex:1,overflow:"hidden"}}>
            <div style={{width:520,flexShrink:0,overflowY:"auto",borderRight:`1px solid ${C.bdr}`}}>
              {loading?<div style={{padding:40,textAlign:"center",color:C.txM,fontSize:12}}><div style={{marginBottom:8,fontSize:14}}>Loading live data...</div><div style={{fontSize:10,color:C.txD}}>Fetching from GitHub repository</div></div>:fetchError&&data.length===0?<div style={{padding:40,textAlign:"center",color:C.amb,fontSize:12}}><div style={{marginBottom:8,fontSize:14}}>{fetchError}</div><div style={{fontSize:10,color:C.txD}}>You can upload a CSV manually using the button above</div></div>:ranked.length===0?<div style={{padding:40,textAlign:"center",color:C.txM,fontSize:12}}>No games match filters</div>:ranked.map((g,i)=><GameRow key={`${g.game_id}__${g.source}__${i}`} game={g} espn={getESPN(g)} sel={`${g.game_id}__${g.source}`===selectedId} onClick={()=>selectGame(`${g.game_id}__${g.source}`)} maxDiv={maxDiv} first={firstByGame[`${g.game_id}__${g.source}`]}/>)}
            </div>
            <div ref={detailRef} style={{flex:1,overflowY:"auto",padding:24,background:C.panel}}>
              {!selectedGame?<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:C.txM,fontSize:13}}>{"\u2190"} Select a game</div>:(()=>{
                const espn=getESPN(selectedGame),first=firstByGame[`${selectedGame.game_id}__${selectedGame.source}`];
                const sm=first&&NUM(selectedGame.spread_line)!==NUM(first.spread_line),tm=first&&NUM(selectedGame.total_line)!==NUM(first.total_line);
                const gd=getGameDate(selectedGame),pred=evalPrediction(selectedGame,espn),done=espn?.done||espn?.sId==="3";
                const lean=sharpLean(selectedGame);
                const ml=isMLSport(selectedGame.sport), sL=sprLabel(selectedGame.sport), fL=spreadLabel(selectedGame.sport);
                return(<div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div>
                    <h2 style={{margin:0,fontSize:22,fontWeight:700}}>{selectedGame.away_team} <span style={{color:C.txM,fontWeight:400}}>@</span> {selectedGame.home_team}</h2>
                    <div style={{display:"flex",gap:10,marginTop:6,fontSize:11,color:C.txD,alignItems:"center",flexWrap:"wrap"}}>
                      <span>{friendlyDate(gd)}</span>{espn&&espn.time&&<span style={{color:C.cyn,fontWeight:600}}>{espn.time} ET</span>}
                      <span>{displaySource(selectedGame.source)} · {selectedGame.book}</span><span>{selectedHistory.length} readings</span>
                      {espn&&<StatusBadge e={espn}/>}{selSrcCount>1&&<span style={{fontSize:9,color:C.pur,fontWeight:600,background:C.purB,padding:"1px 6px",borderRadius:3}}>{selSrcCount} sources</span>}
                    </div></div></div>
                  <div style={{display:"flex",gap:10,marginTop:14,flexWrap:"wrap"}}>
                    <LinePill v={selectedGame.spread_line} l={sL} moved={sm} prev={first?.spread_line}/>
                    <LinePill v={selectedGame.total_line} l="O/U" moved={tm} prev={first?.total_line}/>
                    {lean.sprLabel&&NUM(selectedGame.spread_bets_handle_divergence)>=5&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:NUM(selectedGame.spread_bets_handle_divergence)>=15?C.ambB:C.card,borderRadius:6,border:`1px solid ${NUM(selectedGame.spread_bets_handle_divergence)>=15?C.ambD:C.bdr}`}}><span style={{fontSize:9,color:C.cyn,textTransform:"uppercase",letterSpacing:1.5}}>{"Sharp "+sL}</span><span style={{fontSize:14,fontWeight:700,fontFamily:MN,color:NUM(selectedGame.spread_bets_handle_divergence)>=15?C.amb:C.tx}}>{"\u2192"} {lean.sprLabel}</span></div>}
                    {lean.totLabel&&NUM(selectedGame.total_bets_handle_divergence)>=5&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:NUM(selectedGame.total_bets_handle_divergence)>=15?C.ambB:C.card,borderRadius:6,border:`1px solid ${NUM(selectedGame.total_bets_handle_divergence)>=15?C.ambD:C.bdr}`}}><span style={{fontSize:9,color:C.pur,textTransform:"uppercase",letterSpacing:1.5}}>Sharp O/U</span><span style={{fontSize:14,fontWeight:700,fontFamily:MN,color:NUM(selectedGame.total_bets_handle_divergence)>=15?C.amb:C.tx}}>{"\u2192"} {lean.totLabel}</span></div>}
                  </div>
                  <ScoreBlock e={espn} spr={selectedGame.spread_line} tot={selectedGame.total_line} aw={selectedGame.away_team} hm={selectedGame.home_team} game={selectedGame}/>
                  {done&&(pred.spread||pred.total)&&(<div style={{marginTop:8,padding:"8px 12px",background:C.card,borderRadius:6,border:`1px solid ${C.bdr}`,display:"flex",gap:12,alignItems:"center"}}>
                    <span style={{fontSize:9,color:C.txM,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Sharp Signal</span>
                    {pred.spread&&<span style={{fontSize:11,color:pred.spread==="hit"?C.grn:C.red,fontWeight:600}}>{fL}: {pred.spread==="hit"?"\u2714 Correct":"\u2718 Wrong"}</span>}
                    {pred.total&&<span style={{fontSize:11,color:pred.total==="hit"?C.grn:C.red,fontWeight:600}}>Total: {pred.total==="hit"?"\u2714 Correct":"\u2718 Wrong"}</span>}
                  </div>)}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginTop:16,marginBottom:20}}>
                    {(()=>{const sd=NUM(selectedGame.spread_bets_handle_divergence),td=NUM(selectedGame.total_bets_handle_divergence);return[{l:fL+" Div",v:sd,p:true,clr:sd>=td?C.cyn:null},{l:"Total Div",v:td,p:true,clr:td>sd?C.pur:null},{l:"Readings",v:selectedHistory.length,p:false},{l:"Line Moves",v:(sm?1:0)+(tm?1:0),p:false}];})().map(({l,v,p,clr})=>(
                      <div key={l} style={{padding:"8px 12px",background:C.card,borderRadius:6,border:`1px solid ${p&&v>=15?C.ambD:clr?clr+"33":C.bdr}`}}>
                        <div style={{fontSize:9,color:clr||C.txM,textTransform:"uppercase",letterSpacing:1}}>{l}{p&&clr&&v>=15?" \u2605":""}</div>
                        <div style={{fontSize:20,fontWeight:700,fontFamily:MN,marginTop:2,color:p&&v>=15?C.amb:clr||C.tx}}>{p?`${v.toFixed(1)}%`:v}</div>
                      </div>))}
                  </div>
                  {selSrcCount>=2&&<SourceCompare gameId={selectedGame.game_id} allData={filteredData} sport={selectedGame.sport}/>}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:20,marginBottom:12}}>
                    <div style={{display:"flex",gap:14,fontSize:10}}><span><span style={{display:"inline-block",width:10,height:3,borderRadius:1,background:C.hdl,marginRight:4,verticalAlign:"middle"}}/>Handle</span><span><span style={{display:"inline-block",width:10,height:3,borderRadius:1,background:C.bet,marginRight:4,verticalAlign:"middle"}}/>Bets</span></div>
                    <div style={{display:"flex",gap:4}}>{[["spread","Spread"],["total","Total"],["ml","ML"]].map(([k,l])=><button key={k} style={btn(metric===k)} onClick={()=>setMetric(k)}>{l}</button>)}</div>
                  </div>
                  {selectedHistory.length>1?(<><MoveChart history={selectedHistory} metric={metric} containerWidth={chartW}/><div style={{marginTop:16}}/><DivergenceChart history={selectedHistory} containerWidth={chartW}/></>):<div style={{padding:30,textAlign:"center",color:C.txM,fontSize:12}}>Single reading — need 2+ scrapes</div>}
                </div>);
              })()}
            </div>
          </div></>}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Dashboard));
  </script>
  <script>
    // Catch ALL errors (including async React render errors)
    window.onerror = function(msg, url, line, col, error) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#E8EAF0;background:#0A0E1A;min-height:100vh">' +
        '<h2 style="color:#EF4444">Dashboard runtime error</h2>' +
        '<pre style="color:#8B92B0;margin-top:12px;white-space:pre-wrap;font-size:12px">' +
        msg + '\nLine: ' + line + ', Col: ' + col +
        '\n\n' + (error && error.stack ? error.stack : '') + '</pre></div>';
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#E8EAF0;background:#0A0E1A;min-height:100vh">' +
        '<h2 style="color:#EF4444">Dashboard promise error</h2>' +
        '<pre style="color:#8B92B0;margin-top:12px;white-space:pre-wrap;font-size:12px">' +
        (event.reason ? (event.reason.message || String(event.reason)) : 'Unknown') +
        '\n\n' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre></div>';
    });
    try {
      var jsxSource = document.getElementById('app-source').textContent;
      var compiled = Babel.transform(jsxSource, { presets: ['react'] }).code;
      var script = document.createElement('script');
      script.textContent = compiled;
      document.body.appendChild(script);
    } catch(e) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#E8EAF0;background:#0A0E1A;min-height:100vh">' +
        '<h2 style="color:#EF4444">Failed to start dashboard</h2>' +
        '<pre style="color:#8B92B0;margin-top:12px;white-space:pre-wrap;font-size:12px">' +
        e.message + '\n\n' + (e.stack||'') + '</pre></div>';
    }
  </script>
</body>
</html>
