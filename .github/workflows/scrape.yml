name: Scheduled Scrape

on:
  schedule:
    # Primary triggers: every 30 min at :00 and :30
    - cron: '0,30 * * * *'
    # Backup triggers: :15 and :45 to fill gaps when GitHub drops primary
    - cron: '15,45 * * * *'
  workflow_dispatch:

# Prevent overlapping runs from causing git conflicts
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          pip install -r requirements.txt

      - name: Run scraper
        run: python multi_scraper.py --batch cbb wcbb cbase chockey mlb epl ucl nba --once --auto-close 30

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push
