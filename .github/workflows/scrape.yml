name: Scheduled Scrape

# ---------------------------------------------------------------------------
# REWRITTEN 2026-09-13 — kickoff-aligned timing removed
# ---------------------------------------------------------------------------
# The previous schedule had 16 cron entries pinned to kickoff times, with
# paired runs so that one would land inside the 75-minute --auto-close window
# before each game. Two findings killed that design:
#
# 1. GitHub does not honour the timing. Observed 2026-09-12: an 11:21 AM cron
#    fired at 1:45 PM (2h24m late) and the 2:53 PM cron never fired at all.
#    Precision this schedule depended on is not available in this repo.
#
# 2. splits_history.php does the job better. Measured across 121 CFB games,
#    VSiN's "Last 25 Changes" covers the final 2.5–8 hours before kickoff at
#    ~5-minute resolution. A cron landing once, 40 minutes out, cannot compete
#    with that, and collect_history.py does not care when it runs.
#
# So closing-line capture is now the HARVESTER's job (history.yml), and this
# workflow reverts to what it is actually good at:
#
#   * an independent record of the splits AS WE SAW THEM at decision time
#   * the multi-day move (the 25-change cap cannot reach it on active games)
#   * a fallback if VSiN changes or removes splits_history.php — which is
#     undocumented and reverse-engineered, so treat that as a live risk
#
# Two plain daily runs. No day-of-week logic, no kickoff alignment.
#
# HONEST NOTE ON VOLUME: this is a reallocation, not a reduction. 16 crons
# become 2 here and 2 in history.yml — about the same weekly total. The gain
# is that nothing now depends on a run landing at a precise minute. If GitHub
# throttling stays a problem, cut this to the 18:07 run alone; the harvester
# covers line history either way.
#
# DAYLIGHT SAVING: these are plain daily times, so when the US falls back on
# Sun Nov 1 2026 they simply land an hour earlier in ET. Nothing breaks and
# nothing needs changing — that was the point of removing kickoff alignment.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '7 15 * * *'    # 11:07 AM ET — morning state, pre-slate on game days
    - cron: '7 22 * * *'    #  6:07 PM ET — evening state, captures the day's move
  workflow_dispatch:
    inputs:
      sports:
        description: 'Sports to scrape (space-separated)'
        required: false
        default: 'nfl cfb'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Google Chrome from a real .deb (NOT the chromium snap).
      # apt-get install chromium-browser routes through the snap on Ubuntu 24,
      # which downloads hundreds of MB every run and intermittently fails when
      # the snap store returns HTTP 408 (caused the 2026-06-03 exit-100).
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # --auto-close 75 is retained but is now INCIDENTAL. A game only lands in
      # the window by luck. Closing lines come from history.yml.
      # Add basketball in November: nfl cfb cbb wcbb nba
      # NOTE: verify cbb's gamecode_league first --
      #   python verify_gamecode_markers.py cbb
      # It declares "NCAAB", the same unverified guess that "NCAAF" was, and
      # that one took down the CFB dashboard for a morning on 2026-09-12.
      - name: Run scraper
        env:
          TZ: America/New_York
        run: |
          SPORTS="${{ github.event.inputs.sports || 'nfl cfb' }}"
          python multi_scraper.py --batch $SPORTS --once --auto-close 75

      - name: Upload raw HTML for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ github.run_id }}
          path: data/raw_html/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push
